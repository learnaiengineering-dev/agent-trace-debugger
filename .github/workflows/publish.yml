# Publishes to PyPI when a GitHub release is published, using PyPI trusted publishing
# (no API token stored in the repo). One-time setup on pypi.org: add this repository and
# workflow as a trusted publisher for the project, using the environment name "pypi".
name: Publish to PyPI
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
